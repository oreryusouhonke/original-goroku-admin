<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>オリジナル語録 作成画面</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <aside class="panel">
          <div class="brand">
            <span>オリジナル語録Tシャツ</span>
            <div class="brand-title-row">
              <strong>作成画面</strong>
              <div class="usage-counter" aria-label="利用回数">
                <small>利用回数</small>
                <b id="usageCount" aria-live="polite">--</b>
                <small>回</small>
              </div>
            </div>
          </div>

          <div class="steps">
            <div class="step active"><b>1</b><span>入力</span></div>
            <div class="step"><b>2</b><span>3案確認</span></div>
            <div class="step"><b>3</b><span>採用保存</span></div>
          </div>

          <label>
            <span>お客さん名（空欄OK）</span>
            <input id="customerName" placeholder="例: 山田太郎" autocomplete="off" />
          </label>

          <label>
            <span>注文番号（空欄OK）</span>
            <input id="orderNumber" placeholder="例: 10001234" autocomplete="off" />
          </label>
          <div class="order-lookup">
            <button id="lookupOrder" type="button" class="ghost">注文情報を取得</button>
            <a id="connectNextEngine" href="/api/next-engine/connect">ネクストエンジンと連携</a>
          </div>
          <div id="orderInfo" class="order-info" hidden></div>

          <label>
            <span>語録の区切り</span>
            <textarea id="text" spellcheck="false">スマホより
世の中
みろよ</textarea>
          </label>

          <div class="actions">
            <button id="generate" class="primary">3案を作る</button>
            <button id="clear" class="ghost">入力を消す</button>
          </div>

          <div id="status" class="status">左の項目を入力して「3案を作る」を押してください。</div>
          <div class="save-location">
            <span>保存場所</span>
            <a id="openSaveFolder" href="file://///LS220DD5E/share/オリジナル語録デザイン自動生成" target="_blank" rel="noreferrer">
              フォルダーを開く
            </a>
            <button id="copySavePath" type="button" class="path-copy">パスをコピー</button>
            <code>\\LS220DD5E\share\オリジナル語録デザイン自動生成</code>
          </div>
        </aside>

        <section class="results">
          <div class="toolbar">
            <div>
              <span class="eyebrow">確認</span>
              <h1>良い案を選んで「採用」を押す</h1>
            </div>
          </div>

          <div id="grid" class="grid empty">
            <p>ここに3案が表示されます。</p>
          </div>
        </section>
      </section>
    </main>

    <dialog id="editorDialog" class="editor-dialog">
      <form method="dialog" class="editor-panel">
        <header>
          <div>
            <span class="eyebrow">案を編集</span>
            <h2 id="editorTitle">文字と配置を調整</h2>
          </div>
          <button id="closeEditor" type="button" class="editor-close" aria-label="編集画面を閉じる">×</button>
        </header>
        <div class="editor-body">
          <div class="editor-preview">
            <div id="editorPreview" aria-label="編集中の案"></div>
            <div id="selectionBox" class="selection-box" hidden>
              <button type="button" class="selection-handle resize-handle" aria-label="文字を拡大縮小"></button>
              <button type="button" class="selection-handle rotate-handle" aria-label="文字を回転"></button>
            </div>
            <p class="drag-help">選択枠をドラッグで移動・角で拡大縮小・上の丸で回転・矢印キーで微調整</p>
          </div>
          <div class="editor-controls">
            <label>
              <span>文字・改行</span>
              <textarea id="editorText" spellcheck="false"></textarea>
            </label>
            <label>
              <span>文字サイズ <output id="scaleValue">100%</output></span>
              <input id="editorScale" type="range" min="40" max="180" value="100" />
            </label>
            <label>
              <span>左右位置 <output id="xValue">0</output></span>
              <input id="editorX" type="range" min="-30" max="30" value="0" />
            </label>
            <label>
              <span>上下位置 <output id="yValue">0</output></span>
              <input id="editorY" type="range" min="-30" max="30" value="0" />
            </label>
            <label>
              <span>文字列の間隔 <output id="spacingValue">100%</output></span>
              <input id="editorSpacing" type="range" min="65" max="150" value="100" />
            </label>
            <label>
              <span>傾き <output id="rotationValue">0°</output></span>
              <input id="editorRotation" type="range" min="-20" max="20" value="0" />
            </label>
            <section class="character-editor">
              <div class="character-heading">
                <h3>一文字ずつ調整</h3>
                <span id="selectedCharLabel">文字を選択</span>
              </div>
              <div id="characterList" class="character-list" aria-label="調整する文字"></div>
              <div id="characterControls" class="character-controls">
                <label>
                  <span>文字の大きさ <output id="charScaleValue">100%</output></span>
                  <input id="charScale" type="range" min="40" max="200" value="100" />
                </label>
                <label>
                  <span>文字の左右位置 <output id="charXValue">0</output></span>
                  <input id="charX" type="range" min="-25" max="25" value="0" />
                </label>
                <label>
                  <span>文字の上下位置 <output id="charYValue">0</output></span>
                  <input id="charY" type="range" min="-25" max="25" value="0" />
                </label>
                <label>
                  <span>文字の傾き <output id="charRotationValue">0°</output></span>
                  <input id="charRotation" type="range" min="-30" max="30" value="0" />
                </label>
                <button id="resetCharacter" type="button" class="ghost">この文字だけ戻す</button>
              </div>
            </section>
          </div>
        </div>
        <footer>
          <button id="resetEditor" type="button" class="ghost">調整を戻す</button>
          <button id="applyEditor" type="button">修正版を作る</button>
        </footer>
      </form>
    </dialog>
    <script src="/app.js"></script>
  </body>
</html>
